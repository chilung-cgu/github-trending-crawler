name: Fetch GitHub Trending

on:
  schedule:
    # Monday 07:15 Asia/Taipei = Sunday 23:15 UTC
    - cron: '15 23 * * 0'
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'scripts/fetch_github_trending.py'
      - '.github/workflows/fetch-trending.yml'

permissions:
  contents: write

concurrency:
  group: github-trending-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4

      - name: Fetch fresh Weekly and Monthly Trending
        id: crawl
        shell: bash
        run: |
          set +e
          python scripts/fetch_github_trending.py \
            --output data/github-trending/latest.json \
            --debug-dir debug
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate generated JSON shape
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('data/github-trending/latest.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['schema_version'] == 1
          assert data['status'] in {'ok', 'partial', 'error'}
          assert set(data['periods']) == {'weekly', 'monthly'}
          for period in ('weekly', 'monthly'):
              result = data['periods'][period]
              assert result['status'] in {'ok', 'error'}
              if result['status'] == 'ok':
                  assert len(result['items']) == 10
                  assert [x['rank'] for x in result['items']] == list(range(1, 11))
          print('JSON validation: OK')
          PY

      - name: Commit latest snapshot
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/github-trending/latest.json

          if git diff --cached --quiet; then
            echo 'No snapshot changes to commit.'
            exit 0
          fi

          git commit -m "data: refresh GitHub Trending $(date -u +'%Y-%m-%dT%H:%MZ')"
          git push

      - name: Upload debug HTML on crawler failure
        if: steps.crawl.outputs.exit_code != '0'
        uses: actions/upload-artifact@v4
        with:
          name: github-trending-debug-${{ github.run_id }}
          path: debug/
          if-no-files-found: ignore
          retention-days: 7

      - name: Mark workflow failed when fresh fetch failed
        if: steps.crawl.outputs.exit_code != '0'
        shell: bash
        run: |
          echo 'One or more Trending periods failed after three attempts.' >&2
          exit 1
